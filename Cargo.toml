[package]
name = "axonhub-rs"
version = "0.1.0"
edition = "2021"
description = "High-performance, DB-less Rust gateway for Anthropic/OpenAI LLM traffic"
license = "MIT"

[dependencies]
anyhow = "1"
arc-swap = "1"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
bytes = "1"
futures-util = "0.3"
async-stream = "0.3"
http = "1"
parking_lot = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
